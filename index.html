<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Inknotes</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#2a6fdb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <aside id="library">
      <header><h1>Inknotes</h1><button id="new-notebook" title="Neues Notizbuch">＋</button></header>
      <input id="search" type="search" placeholder="Suchen …" aria-label="Notizbücher durchsuchen" />
      <ul id="notebooks"></ul>
      <footer>
        <button id="sync">Mit Nextcloud synchronisieren</button>
        <button id="folder">Ordner zuweisen</button>
        <button id="import">Goodnotes-Datei importieren</button>
        <input id="import-file" type="file" accept=".goodnotes" multiple hidden />
        <button id="settings">Nextcloud-Konto</button>
        <p id="status"></p>
      </footer>
    </aside>
    <main>
      <nav id="toolbar">
        <button data-tool="pen" class="active">Stift</button>
        <button data-tool="highlighter">Marker</button>
        <button data-tool="eraser">Radierer</button>
        <button data-tool="shape">Form</button>
        <button data-tool="text">Text</button>
        <button data-tool="lasso">Lasso</button>
        <button id="delete-selection" title="Auswahl löschen">Auswahl ✕</button>
        <button id="insert-image">Bild</button>
        <input id="image-file" type="file" accept="image/*" hidden />
        <input id="color" type="color" value="#1d3557" />
        <input id="width" type="range" min="1" max="12" value="3" />
        <button id="undo" title="Rückgängig (Strg+Z)">↶</button>
        <button id="redo" title="Wiederholen (Strg+Y)">↷</button>
        <select id="template">
          <option value="lined">Liniert</option>
          <option value="grid">Kariert</option>
          <option value="dotted">Gepunktet</option>
          <option value="blank">Blanko</option>
        </select>
        <button id="add-page">Seite ＋</button>
        <button id="delete-page">Seite löschen</button>
        <button id="export">Exportieren (PDF)</button>
        <span id="page-label"></span>
        <button id="prev">‹</button><button id="next">›</button>
        <button id="zoom-out" title="Verkleinern">−</button><span id="zoom-label">100 %</span><button id="zoom-in" title="Vergrößern">+</button>
      </nav>
      <div id="stage"><canvas id="page"></canvas></div>
    </main>
    <dialog id="account">
      <form method="dialog">
        <h2>Nextcloud-Konto</h2>
        <label>Server-URL <input name="server" placeholder="https://cloud.example.org" required /></label>
        <label>Benutzername <input name="user" required /></label>
        <label>App-Passwort <input name="appPassword" type="password" required /></label>
        <label>Ordner <input name="folder" value="Inknotes" required /></label>
        <menu><button value="cancel" formnovalidate>Abbrechen</button><button value="save">Speichern</button></menu>
      </form>
    </dialog>
    <div id="print"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
